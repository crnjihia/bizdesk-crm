      <stop stop-color="#059669"/>
      <stop offset="0.5" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ef4444"/>
